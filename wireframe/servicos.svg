    <text x="560" y="380" class="t13" fill="#6b7280">R$ 150,00</text>
    <text x="720" y="380" class="t13" fill="#6b7280">Inativo</text>
    <rect x="1016" y="362" width="70" height="28" rx="6" class="btn"/><text x="1051" y="381" text-anchor="middle" class="btnTxt">Editar</text>

    <text x="16" y="628" font-size="11" font-style="italic" fill="#94a3b8">servicos.php · F2 · listar, editar e inativar · "Inativar" é POST com CSRF + confirmação · estado vazio: "Nenhum serviço cadastrado." com o botão de novo</text>
