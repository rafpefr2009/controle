    <text x="16" y="1058" font-size="11" font-style="italic" fill="#94a3b8">agenda.php · F4 · uma data, 3 colunas por profissional · bloco posicionado por início/duração (1 px por minuto, almoço 12:00–14:00) · clicar no bloco abre a edição</text>
