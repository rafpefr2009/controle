<svg xmlns="http://www.w3.org/2000/svg" width="375" height="900" viewBox="0 0 375 900" font-family="Segoe UI, Arial, sans-serif">
    <title>agenda.php — Agenda do dia (F4) — visão celular (menos de 900 px)</title>
    <style>
        .t15 { font-size: 15px; font-weight: 700; fill: #1f2937; }
        .t12 { font-size: 12px; fill: #1f2937; }
        .t11 { font-size: 11px; fill: #1f2937; }
        .t10h { font-size: 9px; fill: #9ca3af; }
        .t10s { font-size: 10.5px; fill: #6b7280; }
        .btn { fill: #ffffff; stroke: #cbd5e1; }
        .btnP { fill: #5b21b6; }
        .btnTxt { font-size: 11px; fill: #1f2937; }
        .btnTxtB { font-size: 11px; fill: #ffffff; font-weight: 600; }
        .bAgendado { fill: #dbeafe; }
        .bRealizado { fill: #dcfce7; }
    </style>

    <rect width="375" height="900" fill="#f9fafb"/>

    <!-- topo em 2 linhas (menu com wrap) -->
    <rect width="375" height="40" fill="#ffffff"/>
    <text x="12" y="26" font-size="12" font-weight="700" fill="#5b21b6">AgendaSalão</text>
    <text x="363" y="26" text-anchor="end" class="t11">Sair</text>
    <rect y="40" width="375" height="44" fill="#ffffff"/>
    <line x1="0" y1="84" x2="375" y2="84" stroke="#e5e7eb"/>
    <rect x="12" y="48" width="64" height="28" rx="14" fill="#ede9fe"/>
    <text x="44" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Agenda</text>
    <text x="92" y="66" class="t11">Serviços</text>
    <text x="160" y="66" class="t11">Histórico</text>

    <text x="12" y="112" class="t15">Agenda do dia</text>
    <text x="12" y="130" class="t10s">Terça-feira, 10/11/2026 · 07:00–20:00 · almoço 12:00–14:00</text>

    <!-- controles empilhados -->
    <rect x="12" y="144" width="44" height="32" rx="6" class="btn"/><text x="34" y="164" text-anchor="middle" class="btnTxt">◀</text>
    <rect x="62" y="144" width="64" height="32" rx="6" class="btn"/><text x="94" y="164" text-anchor="middle" class="btnTxt">Hoje</text>
    <rect x="132" y="144" width="44" height="32" rx="6" class="btn"/><text x="154" y="164" text-anchor="middle" class="btnTxt">▶</text>
    <rect x="184" y="144" width="116" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="194" y="164" class="t11">10/11/2026</text>
    <rect x="12" y="184" width="160" height="32" rx="6" class="btnP"/>
    <text x="92" y="204" text-anchor="middle" class="btnTxtB">+ Novo agendamento</text>
    <rect x="180" y="184" width="60" height="32" rx="6" class="btn"/><text x="210" y="204" text-anchor="middle" class="btnTxt">PDF</text>

    <!-- grade: cabeçalho das colunas -->
    <rect x="12" y="228" width="48" height="40" fill="#f9fafb"/>
    <line x1="12" y1="228" x2="375" y2="228" stroke="#e5e7eb"/>
    <line x1="12" y1="268" x2="375" y2="268" stroke="#e5e7eb"/>
    <text x="204" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Ana</text>

    <!-- linhas horárias: 40 px por hora (1 px por minuto * 2/3), 07:00–20:00 -->
    <g stroke="#f1f5f9">
        <line x1="12" y1="310" x2="375" y2="310"/><line x1="12" y1="350" x2="375" y2="350"/>
        <line x1="12" y1="390" x2="375" y2="390"/><line x1="12" y1="430" x2="375" y2="430"/>
        <line x1="12" y1="470" x2="375" y2="470"/><line x1="12" y1="550" x2="375" y2="550"/>
        <line x1="12" y1="590" x2="375" y2="590"/><line x1="12" y1="630" x2="375" y2="630"/>
        <line x1="12" y1="670" x2="375" y2="670"/><line x1="12" y1="710" x2="375" y2="710"/>
        <line x1="12" y1="750" x2="375" y2="750"/>
    </g>
    <g stroke="#e2e8f0">
        <line x1="12" y1="270" x2="375" y2="270"/><line x1="12" y1="330" x2="375" y2="330"/>
        <line x1="12" y1="390" x2="375" y2="390"/><line x1="12" y1="450" x2="375" y2="450"/>
        <line x1="12" y1="510" x2="375" y2="510"/><line x1="12" y1="570" x2="375" y2="570"/>
        <line x1="12" y1="630" x2="375" y2="630"/><line x1="12" y1="690" x2="375" y2="690"/>
        <line x1="12" y1="750" x2="375" y2="750"/><line x1="12" y1="790" x2="375" y2="790"/>
    </g>

    <!-- faixa de almoço: 12:00–14:00 -->
    <rect x="60" y="470" width="315" height="80" fill="#f3f4f6" opacity="0.95"/>
    <line x1="60" y1="470" x2="375" y2="470" stroke="#9ca3af" stroke-dasharray="5 4"/>
    <line x1="60" y1="550" x2="375" y2="550" stroke="#9ca3af" stroke-dasharray="5 4"/>
    <text x="215" y="518" text-anchor="middle" font-size="8.5" fill="#6b7280">Almoço · 12:00–14:00</text>

    <!-- eixo de horas (sticky, fixo ao rolar) -->
    <rect x="12" y="268" width="48" height="522" fill="#f9fafb"/>
    <line x1="60" y1="228" x2="60" y2="790" stroke="#e5e7eb"/>
    <g class="t10h" text-anchor="end">
        <text x="56" y="273">07:00</text><text x="56" y="353">09:00</text>
        <text x="56" y="433">11:00</text><text x="56" y="473">12:00</text>
        <text x="56" y="513" font-size="8">almoço</text>
        <text x="56" y="553">14:00</text><text x="56" y="633">16:00</text>
        <text x="56" y="713">18:00</text><text x="56" y="788">20:00</text>
    </g>

    <!-- blocos da coluna Ana -->
    <rect x="64" y="290" width="280" height="40" rx="6" class="bAgendado"/>
    <rect x="64" y="290" width="3" height="40" fill="#1d4ed8"/>
    <text x="76" y="307" font-size="11" font-weight="700" fill="#1e3a8a">07:30 · Maria Souza</text>
    <text x="76" y="322" font-size="10" fill="#1e3a8a">corte feminino · agendado</text>

    <rect x="64" y="550" width="280" height="30" rx="6" class="bRealizado"/>
    <rect x="64" y="550" width="3" height="30" fill="#15803d"/>
    <text x="76" y="569" font-size="11" font-weight="700" fill="#14532d">14:00 · Paula Ribeiro · realizado</text>

    <!-- início da coluna Carla cortada pela borda (rolagem horizontal) -->
    <clipPath id="corte-direita"><rect x="348" y="228" width="27" height="562"/></clipPath>
    <g clip-path="url(#corte-direita)">
        <text x="356" y="252" font-size="10" font-weight="600" fill="#1f2937">Carla</text>
        <rect x="352" y="330" width="20" height="40" rx="4" class="bAgendado"/>
    </g>
    <line x1="348" y1="228" x2="348" y2="790" stroke="#e5e7eb"/>
    <text x="356" y="290" font-size="14" fill="#94a3b8">→</text>

    <!-- corte da trilha (a página continua rolando) -->
    <line x1="12" y1="790" x2="363" y2="790" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <text x="188" y="812" text-anchor="middle" font-size="12" fill="#94a3b8">· · ·</text>
    <text x="12" y="836" font-size="9.5" font-style="italic" fill="#94a3b8">a trilha termina às 20:00 (rolagem vertical)</text>
    <text x="12" y="854" font-size="9.5" font-style="italic" fill="#94a3b8">colunas de Carla e Juliana: rolar para o lado →</text>

    <text x="12" y="888" font-size="9" font-style="italic" fill="#94a3b8">agenda.php · celular (&lt;900 px) · eixo de horas fixo (sticky), tempo = posição preservado · almoço 12:00–14:00</text>
</svg>
