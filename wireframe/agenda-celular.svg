<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Arial, sans-serif">
    <title>agenda.php — Agenda do dia (F4) — visão celular (menos de 900 px)</title>
    <style>
        .t15 { font-size: 15px; font-weight: 700; fill: #1f2937; }
        .t12 { font-size: 12px; fill: #1f2937; }
        .t11 { font-size: 11px; fill: #1f2937; }
        .t10h { font-size: 9px; fill: #9ca3af; }
        .t10s { font-size: 10.5px; fill: #6b7280; }
        .btn { fill: #ffffff; stroke: #cbd5e1; }
        .btnP { fill: #5b21b6; }
        .btnTxt { font-size: 11px; fill: #1f2937; }
        .btnTxtB { font-size: 11px; fill: #ffffff; font-weight: 600; }
        .bAgendado { fill: #dbeafe; }
        .bRealizado { fill: #dcfce7; }
    </style>

    <rect width="375" height="812" fill="#f9fafb"/>

    <!-- topo em 2 linhas (menu com wrap) -->
    <rect width="375" height="40" fill="#ffffff"/>
    <text x="12" y="26" font-size="12" font-weight="700" fill="#5b21b6">AgendaSalão</text>
    <text x="363" y="26" text-anchor="end" class="t11">Sair</text>
    <rect y="40" width="375" height="44" fill="#ffffff"/>
    <line x1="0" y1="84" x2="375" y2="84" stroke="#e5e7eb"/>
    <rect x="12" y="48" width="64" height="28" rx="14" fill="#ede9fe"/>
    <text x="44" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Agenda</text>
    <text x="92" y="66" class="t11">Serviços</text>
    <text x="160" y="66" class="t11">Histórico</text>

    <text x="12" y="112" class="t15">Agenda do dia</text>
    <text x="12" y="130" class="t10s">Terça-feira, 10/11/2026 · 09:00–19:00</text>

    <!-- controles empilhados -->
    <rect x="12" y="144" width="44" height="32" rx="6" class="btn"/><text x="34" y="164" text-anchor="middle" class="btnTxt">◀</text>
    <rect x="62" y="144" width="64" height="32" rx="6" class="btn"/><text x="94" y="164" text-anchor="middle" class="btnTxt">Hoje</text>
    <rect x="132" y="144" width="44" height="32" rx="6" class="btn"/><text x="154" y="164" text-anchor="middle" class="btnTxt">▶</text>
    <rect x="184" y="144" width="116" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="194" y="164" class="t11">10/11/2026</text>
    <rect x="12" y="184" width="160" height="32" rx="6" class="btnP"/>
    <text x="92" y="204" text-anchor="middle" class="btnTxtB">+ Novo agendamento</text>
    <rect x="180" y="184" width="60" height="32" rx="6" class="btn"/><text x="210" y="204" text-anchor="middle" class="btnTxt">PDF</text>

    <!-- grade: cabeçalho das colunas -->
    <rect x="12" y="228" width="48" height="40" fill="#f9fafb"/>
    <line x1="12" y1="228" x2="375" y2="228" stroke="#e5e7eb"/>
    <line x1="12" y1="268" x2="375" y2="268" stroke="#e5e7eb"/>
    <text x="204" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Ana</text>

    <!-- linhas horárias -->
    <g stroke="#f1f5f9">
        <line x1="12" y1="298" x2="375" y2="298"/><line x1="12" y1="358" x2="375" y2="358"/>
        <line x1="12" y1="418" x2="375" y2="418"/><line x1="12" y1="478" x2="375" y2="478"/>
        <line x1="12" y1="538" x2="375" y2="538"/><line x1="12" y1="598" x2="375" y2="598"/>
        <line x1="12" y1="658" x2="375" y2="658"/>
    </g>
    <g stroke="#e2e8f0">
        <line x1="12" y1="328" x2="375" y2="328"/><line x1="12" y1="388" x2="375" y2="388"/>
        <line x1="12" y1="448" x2="375" y2="448"/><line x1="12" y1="508" x2="375" y2="508"/>
        <line x1="12" y1="568" x2="375" y2="568"/><line x1="12" y1="628" x2="375" y2="628"/>
    </g>

    <!-- eixo de horas (sticky, fixo ao rolar) -->
    <rect x="12" y="268" width="48" height="392" fill="#f9fafb"/>
    <line x1="60" y1="228" x2="60" y2="690" stroke="#e5e7eb"/>
    <g class="t10h" text-anchor="end">
        <text x="56" y="271">09:00</text><text x="56" y="331">10:00</text>
        <text x="56" y="391">11:00</text><text x="56" y="451">12:00</text>
        <text x="56" y="511">13:00</text><text x="56" y="571">14:00</text>
        <text x="56" y="631">15:00</text>
    </g>

    <!-- blocos da coluna Ana -->
    <rect x="64" y="328" width="280" height="60" rx="6" class="bAgendado"/>
    <rect x="64" y="328" width="3" height="60" fill="#1d4ed8"/>
    <text x="76" y="350" font-size="11" font-weight="700" fill="#1e3a8a">10:00 · Maria Souza</text>
    <text x="76" y="366" font-size="10" fill="#1e3a8a">corte feminino · agendado</text>

    <rect x="64" y="568" width="280" height="45" rx="6" class="bRealizado"/>
    <rect x="64" y="568" width="3" height="45" fill="#15803d"/>
    <text x="76" y="590" font-size="11" font-weight="700" fill="#14532d">14:00 · Paula Ribeiro</text>
    <text x="76" y="606" font-size="10" fill="#14532d">escova · realizado</text>

    <!-- início da coluna Carla cortada pela borda (rolagem horizontal) -->
    <clipPath id="corte-direita"><rect x="348" y="228" width="27" height="462"/></clipPath>
    <g clip-path="url(#corte-direita)">
        <text x="356" y="252" font-size="10" font-weight="600" fill="#1f2937">Carla</text>
        <rect x="352" y="388" width="20" height="45" rx="4" class="bAgendado"/>
    </g>
    <line x1="348" y1="228" x2="348" y2="690" stroke="#e5e7eb"/>
    <text x="356" y="290" font-size="14" fill="#94a3b8">→</text>

    <!-- corte da trilha (a página continua rolando) -->
    <line x1="12" y1="690" x2="363" y2="690" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <text x="188" y="712" text-anchor="middle" font-size="12" fill="#94a3b8">· · ·</text>
    <text x="12" y="740" font-size="9.5" font-style="italic" fill="#94a3b8">a trilha continua até 19:00 (rolagem vertical)</text>
    <text x="12" y="758" font-size="9.5" font-style="italic" fill="#94a3b8">colunas de Carla e Juliana: rolar para o lado →</text>

    <text x="12" y="792" font-size="9" font-style="italic" fill="#94a3b8">agenda.php · celular (&lt;900 px) · eixo de horas fixo (sticky), tempo = posição preservado</text>
</svg>
